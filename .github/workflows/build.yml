name: build-and-push
on:
  push:
    branches: [main]
    paths-ignore: ["dinov3/**", ".github/workflows/build-dinov3.yml", ".github/workflows/build.yml", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (the base image is ~5 GB compressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/sam31-worker
          docker build -t $IMG:latest -t $IMG:${GITHUB_SHA::12} .
          docker image inspect $IMG:latest --format 'image size: {{.Size}} bytes'
          df -h /
      - name: Push
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/sam31-worker
          docker push $IMG:${GITHUB_SHA::12}
          docker push $IMG:latest
          echo "pushed $IMG:latest and $IMG:${GITHUB_SHA::12}"
